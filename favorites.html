<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoris - SkillHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a href="index.html" class="logo">Skill<span>Hub</span></a>

  <nav>
    <a href="index.html">Accueil</a>
    <a href="services.html">Services</a>
    <a href="messages.html">Messages</a>
  </nav>
</header>

<main class="page">

  <section class="page-header">

    <h1>Mes favoris</h1>

    <p>
      Retrouvez ici les services que vous avez enregistrés.
    </p>

  </section>

  <div id="favoritesList" class="services-grid"></div>

</main>

<script src="script.js"></script>

<script>

function loadFavorites() {

  const container =
    document.getElementById("favoritesList");

  const favorites =
    JSON.parse(localStorage.getItem("skillhubFavorites")) || [];

  const services =
    JSON.parse(localStorage.getItem("skillhubServices")) || [];

  const selected =
    favorites
      .map(id => services[id])
      .filter(service => service);

  if (selected.length === 0) {

    container.innerHTML = `
      <div class="empty-state">

        <h2>Aucun favori</h2>

        <p>
          Vous n'avez pas encore enregistré de service.
        </p>

        <a href="services.html" class="btn">
          Explorer les services
        </a>

      </div>
    `;

    return;
  }

  container.innerHTML =
    selected.map(service => {

      const id = services.indexOf(service);

      return `
        <article class="service-card">

          <span class="service-category">
            ${escapeHTML(service.category)}
          </span>

          <h3>${escapeHTML(service.title)}</h3>

          <p>${escapeHTML(service.description)}</p>

          <strong>${escapeHTML(service.price)}</strong>

          <br><br>

          <a
            href="service.html?id=${id}"
            class="btn"
          >
            Voir le service
          </a>

        </article>
      `;

    }).join("");

}

loadFavorites();

</script>

</body>
</html>
